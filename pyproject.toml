[project]
name = "quariadne"
version = "1.0.1"
description = "Exact solvers of the qubit routing problem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "birkhoff",
    "matplotlib>=3.10.3",
    "mypy>=1.16.0",
    "networkx>=3.5",
    "notebook>=7.4.7",
    "pydot>=4.0.1",
    "pylatexenc>=2.10",
    "qiskit>=2.0.1",
    "qiskit-ibm-runtime>=0.40.1",
    "ruff>=0.11.12",
]

[project.entry-points.'qiskit.transpiler.layout']
"quariadne_ilp" = "quariadne.qiskit_passes:QuariadneIlpLayoutPlugin"
"quariadne_lpm" = "quariadne.qiskit_passes:QuariadneLpLayoutPlugin"
"quariadne_lpe" = "quariadne.qiskit_passes:QuariadneEdgeLayoutPlugin"



[project.entry-points."qiskit.transpiler.routing"]
"quariadne_ilp" = "quariadne.qiskit_passes:QuariadneIlpRoutingPlugin"
"quariadne_lpm" = "quariadne.qiskit_passes:QuariadneLpRoutingPlugin"
"quariadne_lpe" = "quariadne.qiskit_passes:QuariadneEdgeRoutingPlugin"



[tool.uv]
package = true

[tool.uv.sources]
birkhoff = { git = "https://github.com/strategy155/birkhoff.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "mkdocs-material>=9.6.14",
    "mkdocstrings[python]>=0.29.1",
    "pylint>=3.3.7",
    "scipy-stubs>=1.16.1.0",
    "types-networkx>=3.5.0.20250531",
]
# Test dependencies separated per PEP 735 dependency groups
# Ref: https://peps.python.org/pep-0735/
test = [
    "pytest>=9.0.0",  # Modern pytest with native TOML support
]

# pytest configuration using native TOML syntax (pytest 9.0+)
# Ref: https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest]
# Minimum pytest version required for [tool.pytest] native TOML syntax
minversion = "9.0"
# Test discovery paths
testpaths = ["tests"]
# Default command-line options:
# --import-mode=importlib: Recommended for new projects, avoids sys.path manipulation
#   Ref: https://docs.pytest.org/en/stable/explanation/goodpractices.html
# -ra: Show extra test summary info for all except passed tests
# -q: Quiet output mode
addopts = [
    "--import-mode=importlib",
    "-ra",
    "-q",
]
# Custom markers for test categorisation
# Ref: https://docs.pytest.org/en/stable/how-to/mark.html
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
