# Global options:
[mypy]
# Use explicit package bases to avoid duplicate module detection with pytest importlib mode
# Ref: https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
explicit_package_bases = True

[mypy-qiskit.*]
ignore_missing_imports = True

[mypy-birkhoff.*]
ignore_missing_imports = True

[mypy-qiskit_ibm_runtime.*]
ignore_missing_imports = True


